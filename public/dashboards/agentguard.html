function byAgent(id){return usage.filter(x=>x.agentId===id).sort((a,b)=>b.time.localeCompare(a.time))}
function userRows(arr){return `<div class="scroll"><table><thead><tr><th>User</th><th>Agent</th><th>Last invoked</th><th>Last action</th><th>Invocations (demo)</th><th>Result</th></tr></thead><tbody>${arr.map(x=>`<tr><td><b>${safe(x.user)}</b><div class="muted">${safe(x.email)}</div></td><td>${safe(agents.find(a=>a.id===x.agentId).name)}</td><td class="nowrap">${safe(x.time)}</td><td>${safe(x.action)}</td><td>${x.invocations}</td><td><span class="tag ${x.result==='Success'?'low':x.result==='Flagged'?'high':'medium'}">${x.result}</span></td></tr>`).join('')}</tbody></table></div>`}
function table(arr){return `<div class="scroll"><table><thead><tr><th><input type="checkbox" aria-label="Select visible agents" onchange="selectAllVisible(this.checked)" ${arr.length&&arr.every(a=>selectedIds.has(a.id))?'checked':''}></th><th>Agent</th><th>Owner / Team</th><th>Risk</th><th>Status</th><th>Approval</th><th>Users</th><th>Actions</th></tr></thead><tbody>${arr.map(a=>`<tr><td><input type="checkbox" aria-label="Select ${safe(a.name)}" onchange="selectAgent(${a.id},this.checked)" ${selectedIds.has(a.id)?'checked':''}></td><td><b>${safe(a.name)}</b><div class="muted">#AG-${a.id}</div></td><td>${safe(a.owner)}<div class="muted">${safe(a.dept)}</div></td><td>${rt(a)}</td><td><span class="tag ${a.status==='Blocked'?'high':'low'}">${a.status}</span></td><td>${safe(a.approval)}</td><td>${new Set(byAgent(a.id).map(u=>u.email)).size}</td><td>${btn('View details',`inspect(${a.id})`)}</td></tr>`).join('')}</tbody></table></div>`}
function filteredAgents(){return agents.filter(x=>(filter==='All'||(filter==='High risk'?x.risk>=70&&x.status==='Active':filter==='Ownerless'?x.owner==='Unassigned':x.status===filter))&&(x.name+' '+x.owner+' '+x.dept).toLowerCase().includes(query.toLowerCase()))}
function bulkControls(){return `<div class="bulkbar"><span class="count" id="selectionCount">${selectedIds.size} agent(s) selected</span><select id="bulkOp" aria-label="Bulk operation"><option value="block">Block agents</option><option value="unblock">Unblock agents</option><option value="approve">Approve access</option><option value="revoke">Revoke approval</option><option value="owner">Assign owner</option></select>${btn('Apply to selected','bulkAction()','primary')}${btn('Clear selection','clearSelection()')}</div>`}
function inventory(){let a=filteredAgents();const findings=active().filter(a=>a.alerts.length).sort((a,b)=>b.risk-a.risk);return heading('Agent Inventory & Risk Center','Manage the full agent inventory, investigate risk signals and take bulk action')+`<div class="tool"><input id="search" placeholder="Search agents, owners or departments" value="${safe(query)}" oninput="query=this.value;refreshTable()"><select id="filter" onchange="filter=this.value;render()">${['All','Active','High risk','Ownerless','Blocked'].map(x=>`<option ${x===filter?'selected':''}>${x}</option>`).join('')}</select>${btn('Export CSV','exportAgents()')}</div>${bulkControls()}<section class="panel"><h3>${a.length} agents found</h3><div id="tableBody">${table(a)}</div></section><section class="panel risk-section" id="riskFindings"><h3>Risk Center · Active findings</h3><div class="risk-stats"><span class="tag high">${high().length} high-risk active</span><span class="tag medium">${active().filter(a=>a.owner==='Unassigned').length} ownerless</span><span class="tag medium">${active().filter(a=>a.approval==='Pending').length} awaiting approval</span></div>${alertList(findings)}<div class="notice">Response playbook: Detect → Inspect agent and users → Verify permissions → Block or revoke → Audit decision</div></section>`}
function openInventoryRisks(){tab='Agent Inventory';filter='High risk';render();document.getElementById('riskFindings')?.scrollIntoView({behavior:'smooth',block:'start'})}
function refreshTable(){let a=filteredAgents();document.getElementById('tableBody').innerHTML=table(a);document.querySelector('#app .panel h3').textContent=a.length+' agents found'}
function selectionUpdate(){let b=document.getElementById('selectionCount');if(b)b.textContent=selectedIds.size+' agent(s) selected'}
function selectAgent(id,checked){checked?selectedIds.add(id):selectedIds.delete(id);refreshTable();selectionUpdate()}
function selectAllVisible(checked){filteredAgents().forEach(a=>checked?selectedIds.add(a.id):selectedIds.delete(a.id));refreshTable();selectionUpdate()}
function clearSelection(){selectedIds.clear();render()}
function bulkAction(){const op=document.getElementById('bulkOp')?.value;if(!selectedIds.size){sidePanel('No agents selected','Select one or more agents from the inventory before applying a bulk action.',`${btn('Back to inventory','closeModal()','primary')}`);return}const ids=[...selectedIds];let n=ids.length;sidePanel('Confirm bulk action',`<p>You are about to <b>${safe(op)}</b> <b>${n}</b> selected agent(s).</p><p class="muted">${ids.map(id=>safe(agents.find(a=>a.id===id)?.name||'')).join(' · ')}</p>${op==='owner'?'<label for="bulkOwner"><b>Accountable owner name</b></label><input id="bulkOwner" type="text" placeholder="Enter new owner"/>':''}<div class="notice">Demo-only action. Each affected agent is recorded separately in the audit trail.</div>`,`${btn('Cancel','closeModal()')}${btn('Apply action',`commitBulk('${op}')`,'primary')}`)}
function commitBulk(op){const owner=op==='owner'?document.getElementById('bulkOwner')?.value.trim():'';if(op==='owner'&&!owner){document.getElementById('bulkOwner').focus();return}let applied=0;[...selectedIds].forEach(id=>{let a=agents.find(x=>x.id===id);if(!a)return;if(op==='block')a.status='Blocked';if(op==='unblock')a.status='Active';if(op==='approve')a.approval='Approved';if(op==='revoke')a.approval='Revoked';if(op==='owner'){a.owner=owner;a.alerts=a.alerts.filter(v=>!v.toLowerCase().includes('owner'))}audit.unshift({when:new Date().toLocaleTimeString(),event:`Bulk ${op}: ${a.name}${op==='owner'?' → '+owner:''}`,type:'Bulk administrative action'});applied++});selectedIds.clear();render();sidePanel('Bulk action complete',`<p><b>${applied} agent(s)</b> updated successfully in this demo.</p><p class="muted">The associated governance actions are available in Audit Trail.</p>`,btn('Done','closeModal()','primary'))}
function usageView(){let u=usage.filter(x=>{const a=agents.find(a=>a.id===x.agentId);return (x.user+' '+x.email+' '+a.name+' '+x.action).toLowerCase().includes(usageQuery.toLowerCase())});const unique=new Set(u.map(x=>x.email)).size;return heading('Active Users & Usage','Who invoked each agent, when, and what they did — synthetic example records')+`<div class="cards"><div class="card"><div class="label">Distinct users (sample)</div><div class="value">${unique}</div></div><div class="card"><div class="label">Usage records</div><div class="value">${u.length}</div></div><div class="card"><div class="label">Flagged events</div><div class="value">${u.filter(x=>x.result==='Flagged').length}</div></div><div class="card"><div class="label">Denied events</div><div class="value">${u.filter(x=>x.result==='Denied').length}</div></div></div><div class="tool" style="margin-top:17px"><input id="usageSearch" placeholder="Search person, email, agent or action..." value="${safe(usageQuery)}" oninput="usageQuery=this.value;refreshUsage()">${btn('Export usage CSV','exportUsage()')}</div><section class="panel" id="usageTable"><h3>Invocation activity (${u.length} synthetic records)</h3>${userRows(u)}</section>`}
function refreshUsage(){const focus=document.activeElement;const pos=focus&&focus.selectionStart;render();const input=document.getElementById("usageSearch");if(input){input.focus();if(pos!==null)input.setSelectionRange(pos,pos)}}
function exportUsage(){download([['Agent ID','Agent','User','Email','Team','Time','Action','Invocations','Result'],...usage.map(u=>[u.agentId,agents.find(a=>a.id===u.agentId).name,u.user,u.email,u.team,u.time,u.action,u.invocations,u.result])],'agent_usage_demo.csv')}
function riskview(){return heading('Risk Center','Prioritized agent-level security findings')+cards()+`<section class="panel" style="margin-top:15px"><h3>Active risk signals</h3>${alertList(active().filter(a=>a.alerts.length).sort((a,b)=>b.risk-a.risk))}</section><section class="panel" style="margin-top:15px"><h3>Response playbook</h3><p class="muted">Detect → Inspect owner and permissions → Validate approval → Block or revoke → Record audit evidence</p></section>`}
function approvals(){let p=agents.filter(a=>a.approval==='Pending');return heading('Access Approvals','Review and decide on pending agent access requests')+`<section class="panel"><h3>${p.length} pending requests</h3>${p.length?p.map(a=>`<div class="item"><div><strong>${safe(a.name)}</strong><div class="muted">${safe(a.owner)} · ${safe(a.perms.join(', '))}</div></div>${btn('Review',`inspect(${a.id})`)}</div>`).join(''):'<p class="muted">All access requests have been reviewed.</p>'}</section>`}
function auditview(){return heading('Audit Trail','Chronological security alerts and administrator decisions')+`<section class="panel"><h3>Audit events ${btn('Export CSV','exportAudit()')}</h3>${audit.map(x=>`<div class="item"><div><strong>${safe(x.event)}</strong><div class="muted">${safe(x.type)} · Security Admin / System</div></div><span class="muted">${x.when}</span></div>`).join('')}</section>`}
const navPaths=['M3 10 12 3l9 7v10H3Z M9 20v-7h6v7','M4 4h16v16H4Z M4 9h16 M9 9v11','M16 21v-3a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v3 M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M17 4a4 4 0 0 1 0 8 M22 21v-3a4 4 0 0 0-3-4','M12 3 3 7v6c0 5 9 9 9 9s9-4 9-9V7Z M8 12l3 3 5-6','M5 3h14v18H5Z M8 8h8 M8 12h8 M8 16h5'];
function navIcon(i){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${navPaths[i]}"/></svg>`}
function go(t){tab=t;render()}function render(){document.getElementById('nav').innerHTML=tabs.map((t,i)=>`<button class="${t===tab?'active':''}" ${t===tab?'aria-current="page"':''} onclick="go('${t}')">${navIcon(i)}<span class="navlabel">${t}</span></button>`).join('')+'<div class="navfoot"><b><span class="status-dot"></span>Local demo workspace</b>Session-only changes<br>Synthetic security data</div>';app.innerHTML=({'Overview':overview,'Agent Inventory':inventory,'Active Users & Usage':usageView,'Approvals':approvals,'Audit Trail':auditview})[tab]()}
function inspect(id){let a=agents.find(x=>x.id===id),history=byAgent(id),users=[...new Map(history.map(u=>[u.email,u])).values()];modal.innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="Agent security details"><div class="modalhead"><div><h2 style="margin:0 0 4px">${safe(a.name)}</h2><div class="muted">Agent #AG-${a.id} · ${safe(a.dept)} · Detailed security profile</div></div>${btn('✕','closeModal()')}</div><div class="cards" style="grid-template-columns:repeat(3,1fr);margin-top:20px"><div class="card"><div class="label">Risk score</div><div class="value">${a.risk}</div></div><div class="card"><div class="label">Status</div><p><b>${a.status}</b></p></div><div class="card"><div class="label">Approval</div><p><b>${a.approval}</b></p></div></div><div class="detailsgrid"><div class="micro"><strong>Ownership</strong><p>Accountable owner: <b>${safe(a.owner)}</b></p><p>Department: ${safe(a.dept)}</p><p>Last reported use: ${safe(a.last)}</p></div><div class="micro"><strong>Usage snapshot</strong><p>Distinct users in sample: <b>${users.length}</b></p><p>Sample invocation records: <b>${history.length}</b></p><p>Sample requests: <b>${history.reduce((s,x)=>s+x.invocations,0)}</b></p></div></div><h3 class="sectiontitle">Who used this agent?</h3><p class="muted">These identities and timestamps are illustrative, not connected to real user activity.</p><div class="scroll"><table><thead><tr><th>Person</th><th>Email / Team</th><th>Sample requests</th><th>Latest activity</th></tr></thead><tbody>${users.map(u=>{const r=history.filter(x=>x.email===u.email);return `<tr><td><b>${safe(u.user)}</b></td><td>${safe(u.email)}<div class="muted">${safe(u.team)}</div></td><td>${r.reduce((s,x)=>s+x.invocations,0)}</td><td>${safe(r[0].time)}</td></tr>`}).join('')}</tbody></table></div><h3 class="sectiontitle">Recent agent actions</h3>${userRows(history)}<h3 class="sectiontitle">Effective permissions</h3>${a.perms.map(p=>`<div class="permission">✓ ${safe(p)}</div>`).join('')}<h3 class="sectiontitle">Security findings</h3>${a.alerts.map(p=>`<div class="notice">⚠ ${safe(p)}</div>`).join('')||'<p class="muted">No active security findings</p>'}<h3 class="sectiontitle">Agent governance history</h3>${audit.filter(x=>x.event.includes(a.name)).slice(0,8).map(x=>`<div class="permission">${safe(x.when)} · ${safe(x.event)}</div>`).join('')||'<p class="muted">No admin changes recorded in this session.</p>'}<div class="actions">${a.status==='Active'?btn('Block agent',`change(${id},'block')`,'danger'):btn('Unblock agent',`change(${id},'unblock')`)}${a.approval==='Pending'?btn('Approve',`change(${id},'approve')`,'primary')+btn('Reject',`change(${id},'reject')`):btn('Revoke approval',`change(${id},'revoke')`)}${a.owner==='Unassigned'?btn('Assign owner',`change(${id},'owner')`):''}</div><p class="muted" style="margin-top:15px">Demo actions only. No real agents or user accounts are affected.</p></div></div>`}
function sidePanel(title,body,buttons){modal.innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="${safe(title)}"><div class="modalhead"><h2 style="margin:0">${safe(title)}</h2>${btn('✕','closeModal()')}</div><div style="margin-top:18px;font-size:14px;line-height:1.6">${body}</div><div class="actions">${buttons||btn('Close','closeModal()')}</div></div></div>`}
function closeModal(){modal.innerHTML='';document.querySelector('nav button.active')?.focus()}
function change(id,op){let a=agents.find(x=>x.id===id);if(!a)return;sidePanel('Confirm agent action',`<p>Apply <b>${safe(op)}</b> to <b>${safe(a.name)}</b>?</p>${op==='owner'?'<label><b>Accountable owner</b></label><input id="newOwner" type="text" placeholder="Enter owner name"/>':''}<div class="notice">This updates synthetic demo data only and adds an audit record.</div>`,`${btn('Cancel',`inspect(${id})`)}${btn('Confirm',`commitChange(${id},'${op}')`,'primary')}`)}
function commitChange(id,op){let a=agents.find(x=>x.id===id);if(!a)return;if(op==='owner'){let n=document.getElementById('newOwner')?.value.trim();if(!n){document.getElementById('newOwner').focus();return}a.owner=n;a.alerts=a.alerts.filter(v=>!v.toLowerCase().includes('owner'))}else if(op==='block')a.status='Blocked';else if(op==='unblock')a.status='Active';else if(op==='approve')a.approval='Approved';else if(op==='reject')a.approval='Rejected';else if(op==='revoke')a.approval='Revoked';audit.unshift({when:new Date().toLocaleTimeString(),event:`${a.name}: ${op}${op==='owner'?' assigned '+a.owner:''}`,type:'Administrative action'});render();inspect(id)}
new MutationObserver(()=>{const d=modal.querySelector('.modal');document.body.style.overflow=d?'hidden':'';if(d){d.querySelector('button,input,select')?.focus()}}).observe(modal,{childList:true});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.firstChild)closeModal();if(e.key==='Tab'&&modal.firstChild){const f=[...modal.querySelectorAll('button,input,select,a[href]')];if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function download(rows,name){let csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');let u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));let a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportAgents(){download([['ID','Agent','Owner','Department','Risk','Status','Approval','Permissions'],...agents.map(a=>[a.id,a.name,a.owner,a.dept,a.risk,a.status,a.approval,a.perms.join('; ')])],'agents.csv')}function exportAudit(){download([['Time','Event','Type'],...audit.map(x=>[x.when,x.event,x.type])],'audit.csv')}render();
</script></body></html>
